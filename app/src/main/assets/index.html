<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calendar Natural</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0e;--card:#15171b;--card2:#1d2025;--text:#f4f4f5;--muted:#a5a7ad;--line:#2a2e35;--accent:#f0c75e;--spring:#315b3c;--summer:#6a5521;--autumn:#6a3d27;--winter:#31465c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 92px}h1{font-size:25px;margin:4px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}.hero{background:linear-gradient(145deg,#191b20,#111318);border:1px solid var(--line);border-radius:22px;padding:20px}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.big{font-size:36px;font-weight:800;margin:8px 0 4px}.civil{font-size:15px;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid var(--line);background:var(--card2);padding:8px 10px;border-radius:999px;font-size:13px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:10px 12px;border-radius:12px;font-weight:650}.btn.primary{background:var(--accent);color:#14110a;border-color:transparent}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.wd{font-size:11px;text-align:center;color:var(--muted);padding:5px 0}.day{min-height:62px;border:1px solid var(--line);border-radius:12px;padding:7px;background:#111318}.day.empty{opacity:.2}.day .n{font-weight:800;font-size:16px}.day .g{color:var(--muted);font-size:10px;margin-top:5px}.day.today{outline:2px solid var(--accent)}.day.phase{border-color:#6b707a}.seasonbar{height:8px;border-radius:999px;margin-top:10px}.spring{background:var(--spring)}.summer{background:var(--summer)}.autumn{background:var(--autumn)}.winter{background:var(--winter)}input{width:100%;background:#101216;border:1px solid var(--line);color:var(--text);padding:13px;border-radius:12px;font-size:16px}.result{margin-top:12px;font-size:18px;font-weight:750}.muted{color:var(--muted);font-size:12px;margin-top:5px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,14,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.nav button{flex:1;max-width:220px}.hidden{display:none}
</style></head><body><div class="wrap">
<h1>Calendar Natural</h1><div class="sub">Soare + Lună + anotimpuri</div>
<section id="todayPage"><div class="hero"><div class="eyebrow">Astăzi</div><div class="big" id="naturalDate">—</div><div class="civil" id="civilDate">—</div><div class="chips"><span class="chip" id="moonChip">🌙 —</span><span class="chip" id="seasonChip">☀ —</span><span class="chip" id="yearChip">An natural —</span></div></div><div class="section"><h2>Ciclul curent</h2><div class="card"><div class="row"><span>Luna naturală</span><b id="monthRange">—</b></div><div class="row" style="margin-top:10px"><span>Următoarea Lună nouă</span><b id="nextNew">—</b></div><div id="seasonBar" class="seasonbar"></div></div></div></section>
<section id="calendarPage" class="hidden"><div class="card"><div class="row"><button class="btn" id="prev">‹</button><div style="text-align:center"><b id="calTitle">Luna —</b><div class="muted" id="calRange"></div></div><button class="btn" id="next">›</button></div><div class="grid" id="calendarGrid"></div></div></section>
<section id="convertPage" class="hidden"><div class="card"><h2>Convertor</h2><input id="dateInput" type="date"><button class="btn primary" id="convert" style="width:100%;margin-top:10px">Convertește</button><div class="result" id="convertResult"></div><div class="muted" id="convertMeta"></div></div></section>
</div><div class="nav"><button class="btn primary" data-page="todayPage">Azi</button><button class="btn" data-page="calendarPage">Calendar</button><button class="btn" data-page="convertPage">Convertor</button></div>
<script>
const DAY=86400000, SYN=29.530588853, EPOCH=Date.UTC(2000,0,6,18,14);
const exactNew=['1982-02-23','1982-03-25','1982-04-23','1982-05-23','1982-06-21','1982-07-21','1982-08-19','1982-09-18','2026-03-19','2026-04-17','2026-05-16','2026-06-15','2026-07-14','2026-08-12','2026-09-11','2026-10-10','2026-11-09','2026-12-09','2027-01-07','2027-02-06','2027-03-08','2027-04-07','2027-05-06','2027-06-04','2027-07-04','2027-08-02','2027-08-31','2027-09-30','2027-10-29','2027-11-28','2027-12-27','2028-01-26','2028-02-25','2028-03-26'].map(s=>new Date(s+'T00:00:00'));
const seasonExact={'2026-03-20':'Primăvară','2026-06-21':'Vară','2026-09-23':'Toamnă','2026-12-21':'Iarnă','2027-03-20':'Primăvară','2027-06-21':'Vară','2027-09-23':'Toamnă','2027-12-22':'Iarnă','2028-03-20':'Primăvară'};
function d0(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())} function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function approxPrevNew(d){let k=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/(SYN*DAY));return new Date(EPOCH+k*SYN*DAY)}
function aroundExact(d){let t=d0(d).getTime(),arr=exactNew.slice().sort((a,b)=>a-b),p=null,n=null;for(let x of arr){if(x.getTime()<=t)p=x;if(x.getTime()>t){n=x;break}}if(p&&n&&t-p<40*DAY&&n-t<40*DAY)return [d0(p),d0(n)];let pA=d0(approxPrevNew(d)),nA=new Date(pA.getTime()+Math.round(SYN)*DAY);if(nA<=d0(d))nA=new Date(nA.getTime()+DAY);return [pA,nA]}
function springDate(y){return new Date(y,2,20)} function naturalYearStart(d){let y=d.getFullYear();return d>=springDate(y)?springDate(y):springDate(y-1)}
function monthOneStart(d){let s=naturalYearStart(d),[p]=aroundExact(s);return p}
function naturalInfo(d){d=d0(d);let [p,n]=aroundExact(d),m1=monthOneStart(d),month=Math.round((p-m1)/(SYN*DAY))+1;if(month<1)month=1;let day=Math.round((d-p)/DAY)+1;let y0=naturalYearStart(d),phaseAge=((d-p)/DAY);let phase=phaseAge<2?'Lună nouă':phaseAge<9?'În creștere':phaseAge<16?'Lună plină':phaseAge<23?'În descreștere':'Lună veche';return {d,p,n,month,day,y0,phase}}
function season(d){d=d0(d);let y=d.getFullYear(),s1=new Date(y,2,20),su=new Date(y,5,21),au=new Date(y,8,23),wi=new Date(y,11,(y===2027?22:21));if(d<s1)return 'Iarnă';if(d<su)return 'Primăvară';if(d<au)return 'Vară';if(d<wi)return 'Toamnă';return 'Iarnă'}
function fmt(d){return d.toLocaleDateString('ro-RO',{day:'numeric',month:'short',year:'numeric'})} function emojiSeason(s){return {Primăvară:'🌱',Vară:'☀️',Toamnă:'🍂',Iarnă:'❄️'}[s]}
function renderToday(){let i=naturalInfo(new Date()),s=season(i.d);naturalDate.textContent=`Luna ${i.month} • Ziua ${i.day}`;civilDate.textContent=i.d.toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});moonChip.textContent=`🌙 ${i.phase}`;seasonChip.textContent=`${emojiSeason(s)} ${s}`;yearChip.textContent=`An natural ${i.y0.getFullYear()}–${i.y0.getFullYear()+1}`;monthRange.textContent=`${fmt(i.p)} → ${fmt(new Date(i.n-DAY))}`;nextNew.textContent=fmt(i.n);seasonBar.className='seasonbar '+({Primăvară:'spring',Vară:'summer',Toamnă:'autumn',Iarnă:'winter'}[s]);calStart=i.p}
let calStart=new Date();function renderCalendar(){let start=d0(calStart),next=aroundExact(new Date(start.getTime()+2*DAY))[1];let info=naturalInfo(start),len=Math.round((next-start)/DAY);calTitle.textContent=`Luna ${info.month}`;calRange.textContent=`${fmt(start)} – ${fmt(new Date(next-DAY))}`;let names=['L','Ma','Mi','J','V','S','D'],html=names.map(x=>`<div class="wd">${x}</div>`).join('');let off=(start.getDay()+6)%7;for(let z=0;z<off;z++)html+='<div class="day empty"></div>';let today=iso(new Date());for(let j=1;j<=len;j++){let d=new Date(start.getTime()+(j-1)*DAY),age=j-1,ph=(age===0||age===7||age===15||age===22)?' phase':'';html+=`<div class="day${iso(d)===today?' today':''}${ph}"><div class="n">${j}</div><div class="g">${d.getDate()} ${d.toLocaleDateString('ro-RO',{month:'short'})}</div></div>`}calendarGrid.innerHTML=html}
function convertDate(){let v=dateInput.value;if(!v)return;let d=new Date(v+'T00:00:00'),i=naturalInfo(d),s=season(d);convertResult.textContent=`Luna ${i.month} • Ziua ${i.day}`;convertMeta.textContent=`${emojiSeason(s)} ${s} • An natural ${i.y0.getFullYear()}–${i.y0.getFullYear()+1} • ${i.phase}`}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('primary',b.dataset.page===id));if(id==='calendarPage')renderCalendar()}
renderToday();dateInput.value=iso(new Date());convert.onclick=convertDate;prev.onclick=()=>{let [p]=aroundExact(new Date(calStart.getTime()-2*DAY));calStart=p;renderCalendar()};next.onclick=()=>{let n=aroundExact(new Date(calStart.getTime()+2*DAY))[1];calStart=n;renderCalendar()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
</script></body></html>
